org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# Required, not optional: KSP (Room + Hilt) registers its generated-source directories through the
# Kotlin source-set DSL, which AGP's built-in Kotlin support now disallows by default. Removing this
# fails configuration outright with "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed
# with built-in Kotlin". Revisit when KSP registers via android.sourceSets instead.
android.disallowKotlinSourceSets=false
# Silences the "experimental option" notice for the line above, which is a deliberate choice.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
